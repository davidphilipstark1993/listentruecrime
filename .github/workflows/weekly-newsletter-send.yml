name: Weekly Manual Newsletter Send

on:
  schedule:
    # 08:00 UTC every Sunday — 08:00 GMT in winter / 09:00 BST in summer
    # (UK). GitHub Actions cron is always UTC and doesn't observe daylight
    # saving, so the local run time drifts by an hour seasonally.
    - cron: '0 8 * * 0'
  workflow_dispatch: {} # manual trigger for testing or a rerun

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm ci fails here on a platform-specific optionalDependencies quirk
      # (the wasm32 fallback packages resolve differently on the Linux
      # runner than on the macOS machine that generated the lockfile).
      # npm install self-heals instead of hard-failing on that mismatch.
      - run: npm install

      # Deliberately does NOT include ANTHROPIC_API_KEY — this workflow
      # never imports or calls the Anthropic-backed copy-drafting code.
      # The manual weekly newsletter only needs Supabase + an email provider
      # (SendGrid if configured, otherwise Resend — see
      # lib/email/newsletter-campaign.ts and lib/email/adminNotify.ts).
      - name: Check this week's approved podcasts and send if ready
        run: npx tsx scripts/newsletter/weekly-send.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SENDGRID_FROM_NAME: ${{ secrets.SENDGRID_FROM_NAME }}
          SENDGRID_UNSUBSCRIBE_GROUP_ID: ${{ secrets.SENDGRID_UNSUBSCRIBE_GROUP_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

      # This job only ever sends when: (a) exactly 5 podcasts are
      # individually approved, AND (b) newsletters.status='approved' — set
      # either by explicitly clicking "Approve for Sunday Sending" in
      # /admin/weekly-newsletter, or by weekly-newsletter-autofill.yml's
      # 07:00 UTC last-minute catch (same day, one hour before this job)
      # auto-picking 5 directory podcasts if nothing was added that week.
      # Any other state — including the separate discovery automation
      # simply having run — results in a "not sent" notification email,
      # never a send.
