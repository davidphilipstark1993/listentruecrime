name: Weekly Newsletter Auto-Fill

on:
  schedule:
    # 07:00 UTC every Sunday — one hour before weekly-newsletter-send.yml's
    # 08:00 UTC send. A last-minute catch, not an early-week draft: if
    # nobody (e.g. the Grok-curated workflow) has added any picks for this
    # Sunday's newsletter by then, this fills it from the directory so a
    # newsletter still goes out; if picks already exist, it does nothing.
    - cron: '0 7 * * 0'
  workflow_dispatch: {} # manual trigger for testing or a rerun

jobs:
  autofill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Auto-fill this week's newsletter from the podcast directory
        run: npx tsx scripts/newsletter/auto-feature.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SENDGRID_FROM_NAME: ${{ secrets.SENDGRID_FROM_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

      # Only ever inserts newsletter_submissions rows and, when it fills a
      # newsletter, sets its status to 'approved' — the same state a manual
      # "Approve for Sunday Sending" click sets. It never sends anything;
      # weekly-newsletter-send.yml (08:00 UTC, same day) is the only job
      # that sends, and only if the newsletter is still 'approved' when it
      # runs. Editing/unapproving any pick in /admin/weekly-newsletter any
      # time before 07:00 UTC overrides this run.
